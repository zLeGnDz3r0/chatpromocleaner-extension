<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twitch Chat Promo Cleaner</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <img class="logo" src="icons/icon48.png" alt="" width="36" height="36" />
        <div>
          <h1>Chat Promo Cleaner</h1>
          <p class="subtitle">Limpia banners encima del chat de Twitch</p>
        </div>
      </header>

      <div class="toggle-stack">
        <label class="toggle-row" for="toggle">
          <div class="toggle-copy">
            <span class="toggle-title">Eliminar promos del chat</span>
            <span id="statusText" class="toggle-status">Activado</span>
          </div>
          <input id="toggle" type="checkbox" role="switch" checked />
          <span class="switch" aria-hidden="true"></span>
        </label>

        <label class="toggle-row" for="adsToggle">
          <div class="toggle-copy">
            <span class="toggle-title">Eliminar anuncios y colaboraciones</span>
            <span id="adsStatusText" class="toggle-status">Activado</span>
          </div>
          <input id="adsToggle" type="checkbox" role="switch" checked />
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>

      <p class="hint">
        El primer toggle oculta channel skins compartidos (bonus de subs, etc.).
        El segundo oculta los banners de marca / “Anuncio” encima del chat,
        da igual la colaboración. No toca encuestas ni predicciones.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
